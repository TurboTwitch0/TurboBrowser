name: Refresh daily content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-daily-content.yml'
      - 'scripts/update-daily-content.mjs'
      - 'tests/feed.test.mjs'
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-daily-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check feed normalization and failure recovery
        run: node --test tests/feed.test.mjs

      - name: Fetch Wikipedia featured content
        run: node scripts/update-daily-content.mjs

      - name: Commit refreshed content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-content.json
          if git diff --cached --quiet; then
            echo "Daily content is unchanged."
            exit 0
          fi
          git commit -m "Refresh daily content"
          git push origin HEAD:main
